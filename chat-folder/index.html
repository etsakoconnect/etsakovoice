<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Community Registration Portal</title>
  <style>
    :root {
      --primary: #075e54;
      --secondary: #128c7e;
      --bg: #f3f4f6;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 450px;
      box-sizing: border-box;
    }
    h2 { text-align: center; color: var(--primary); margin-top: 0; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; color: #333; }
    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover { background: var(--secondary); }
    .footer-link { text-align: center; margin-top: 15px; font-size: 14px; }
    .footer-link a { color: var(--secondary); text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Community Member Registration</h2>
    <form id="regForm">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="fullName" required placeholder="John Doe">
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" required placeholder="john@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" id="phone" required placeholder="+234...">
      </div>
      <div class="form-group">
        <label>Community / Village</label>
        <select id="village" required>
          <option value="">Select Community</option>
          <option value="Ekperi">Ekperi</option>
          <option value="Udaba">Udaba</option>
          <option value="Unueda">Unueda</option>
          <option value="Auchi">Auchi</option>
          <option value="Okpella">Okpella</option>
        </select>
      </div>
      <div class="form-group">
        <label>Passport Photo (Optional URL)</label>
        <input type="url" id="passport" placeholder="https://example.com/photo.jpg">
      </div>
      <button type="submit">Register Account</button>
    </form>
    <div class="footer-link">
      Already registered? <a href="login.html">Login here</a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_KEY"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    const auth = getAuth(app);

    document.getElementById("regForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const fullName = document.getElementById("fullName").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const phone = document.getElementById("phone").value;
      const village = document.getElementById("village").value;
      const passport = document.getElementById("passport").value || "https://via.placeholder.com/150";

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        await set(ref(database, 'members/' + user.uid), {
          uid: user.uid,
          fullName: fullName,
          email: email,
          phone: phone,
          village: village,
          passport: passport,
          status: "pending",
          role: "member",
          registeredAt: Date.now()
        });

        alert("Registration successful! Your registration is pending approval by the admin.");
        window.location.href = "login.html";
      } catch (error) {
        alert("Error: " + error.message);
      }
    });
  </script>
</body>
</html>
